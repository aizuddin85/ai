# Nginx configuration for the AKS Health React SPA.
#
# Listens on port 8080 so the container runs as a non-root user
# (binding ports < 1024 requires root or CAP_NET_BIND_SERVICE).
#
# In Kubernetes the Ingress controller routes:
#   /api/*  → backend service (FastAPI)
#   /*      → frontend service (this nginx)
# No upstream proxy block is needed here.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # -----------------------------------------------------------------
    # SPA routing – every path serves index.html so React Router works
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------
    # Health / readiness probe (Kubernetes httpGet)
    # -----------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # -----------------------------------------------------------------
    # Cache-busting for hashed JS / CSS assets (Vite adds content hash)
    # -----------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # -----------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header X-XSS-Protection       "1; mode=block"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;

    # -----------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
