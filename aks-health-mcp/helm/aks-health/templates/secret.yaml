{{- if include "aks-health.createSecret" . }}
# Chart-managed Secret for Azure credentials.
# Only rendered when existingSecret is not set AND at least one credential
# value is non-empty.
#
# IMPORTANT: Do NOT put plaintext secrets in values.yaml for production.
# Prefer one of:
#   • Azure Workload Identity (no secret needed at all — recommended)
#   • External Secrets Operator syncing from Azure Key Vault
#   • Sealed Secrets / SOPS for GitOps workflows
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aks-health.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aks-health.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.credentials.azureClientSecret }}
  AZURE_CLIENT_SECRET: {{ .Values.backend.credentials.azureClientSecret | quote }}
  {{- end }}
  {{- if .Values.backend.credentials.azureFoundryApiKey }}
  AZURE_FOUNDRY_API_KEY: {{ .Values.backend.credentials.azureFoundryApiKey | quote }}
  {{- end }}
{{- end }}
