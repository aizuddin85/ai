# =============================================================================
# AKS Health Helm Chart – default values
# =============================================================================
# Copy this file and override the values marked "# REQUIRED".
#
# Minimal install (single subscription, Workload Identity):
#
#   backend:
#     image:
#       repository: myacr.azurecr.io/aks-health-backend
#       tag: "1.0.0"
#     config:
#       azureTenantId: "00000000-0000-0000-0000-000000000000"
#       azureSubscriptionIds: "11111111-1111-1111-1111-111111111111"
#       azureFoundryEndpoint: "https://<project>.services.ai.azure.com/models"
#       azureFoundryModel: "gpt-4o"
#       azureAdAppClientId: "22222222-2222-2222-2222-222222222222"
#       frontendOrigin: "https://aks-health.contoso.com"
#
#   frontend:
#     image:
#       repository: myacr.azurecr.io/aks-health-frontend
#       tag: "1.2.0"
#
#   serviceAccount:
#     annotations:
#       azure.workload.identity/client-id: "<MANAGED_IDENTITY_CLIENT_ID>"
#
#   ingress:
#     enabled: true
#     host: aks-health.contoso.com
#     tls:
#       enabled: true
#       secretName: aks-health-tls
# =============================================================================

# ---------------------------------------------------------------------------
# Image pull secrets (e.g. ACR pull secret)
# ---------------------------------------------------------------------------
imagePullSecrets: []
# - name: acr-pull-secret

# ---------------------------------------------------------------------------
# Backend – FastAPI + MCP server + Azure AI Foundry agents
# ---------------------------------------------------------------------------
backend:
  image:
    repository: ""        # REQUIRED  e.g. myacr.azurecr.io/aks-health-backend
    tag: ""               # REQUIRED  e.g. "1.2.0" or git SHA
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

  service:
    type: ClusterIP
    port: 8000

  # ── Non-sensitive configuration (stored in a ConfigMap) ──────────────────
  config:
    # Azure AD
    azureTenantId: ""               # REQUIRED  Azure AD tenant GUID
    azureSubscriptionIds: ""        # REQUIRED  Comma-separated subscription GUIDs
    azureFoundryEndpoint: ""        # REQUIRED  Foundry inference URL
    azureFoundryModel: ""           # REQUIRED  e.g. "gpt-4o"
    azureAdAppClientId: ""          # REQUIRED  Frontend app registration client ID
    frontendOrigin: ""              # REQUIRED  React app URL (CORS)

    # Logging
    logLevel: "INFO"                # DEBUG | INFO | WARNING | ERROR
    logFormat: "json"               # json | console

    # Kubernetes – in-cluster auth is used automatically when deployed on AKS
    k8sInCluster: "true"
    mcpTransport: "stdio"

  # ── Sensitive credentials (stored in a Kubernetes Secret) ────────────────
  # azureClientSecret : Client secret of the app registration (same app as
  #                     azureAdAppClientId).  Required for On-Behalf-Of (OBO)
  #                     token exchange so Azure API calls run as the signed-in
  #                     user.  Leave blank to use Workload Identity (recommended
  #                     for production — no secret needed).
  # azureFoundryApiKey: Leave blank to use the Azure AD credential chain.
  credentials:
    azureClientSecret: ""
    azureFoundryApiKey: ""          # Leave blank to use Azure AD credential chain

  # ── External secret (optional) ───────────────────────────────────────────
  # If you manage secrets externally (e.g. Azure Key Vault CSI driver or
  # External Secrets Operator) set this to the name of an existing Secret
  # that contains AZURE_CLIENT_SECRET, AZURE_FOUNDRY_API_KEY.
  # When set, the credentials block above is ignored.
  existingSecret: ""

# ---------------------------------------------------------------------------
# Frontend – React SPA served by Nginx
# ---------------------------------------------------------------------------
frontend:
  enabled: true

  image:
    repository: ""        # REQUIRED  e.g. myacr.azurecr.io/aks-health-frontend
    tag: ""               # REQUIRED  e.g. "1.2.0" or git SHA
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  service:
    type: ClusterIP
    port: 8080            # matches the nginx-unprivileged default

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: ""               # e.g. aks-health.contoso.com
  tls:
    enabled: false
    secretName: ""       # leave blank to auto-generate from host name

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""               # auto-generated when blank
  annotations: {}
    # For Azure Workload Identity (recommended over SP credentials):
    # azure.workload.identity/client-id: "<MANAGED_IDENTITY_CLIENT_ID>"

# ---------------------------------------------------------------------------
# RBAC – read-only ClusterRole for Kubernetes API
# ---------------------------------------------------------------------------
rbac:
  create: true

# ---------------------------------------------------------------------------
# Pod-level metadata (labels / annotations applied to all pods)
# ---------------------------------------------------------------------------
podAnnotations: {}
  # For Azure Workload Identity, set this on the backend pod:
  # azure.workload.identity/use: "true"

podLabels: {}
