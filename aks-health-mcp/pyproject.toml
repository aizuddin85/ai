[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aks-health-mcp"
version = "2.0.0"
description = "AKS health agent layer powered by the official Microsoft AKS MCP server (github.com/Azure/aks-mcp)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # MCP client SDK (used by agents to communicate with the aks-mcp binary)
    "mcp>=1.3.0",
    # Azure SDK – identity only; ARM/monitor queries are delegated to the aks-mcp binary
    "azure-identity>=1.19.0",
    # Azure AI Foundry (for agents)
    "azure-ai-inference>=1.0.0b9",
    # Config / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    # Async / HTTP
    "httpx>=0.28.0",
    "anyio>=4.7.0",
    # Logging
    "structlog>=24.4.0",
    # Retry
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server", "agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
